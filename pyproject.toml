[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexe-possession"
version = "0.1.0"
description = "Interpretable tracking-based football possession estimation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy==2.2.6", "pandas==3.1.0"]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "ruff==0.12.5"]

[project.scripts]
possession = "possession.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
